name: Deploy GitHub Pages (prod + preview)

# Déploie le site statique sur GitHub Pages :
#   - push sur main        → déploiement PRODUCTION (utilisé par les autres utilisateurs)
#   - push sur toute autre branche (ex. dev-branch) → PRÉVISUALISATION sur une
#     URL dédiée à la branche, SANS toucher à main (test mobile possible).
#
# ⚠️ Configuration UNE FOIS sur GitHub (la workflow ne peut pas le faire seule) :
#   Settings → Pages → Source : « GitHub Actions »
#   (au lieu de « Deploy from a branch »). Après ce changement, cette workflow prend le relais.
#
# Notes :
#   - Chaque branche non-main est déployée dans son propre environnement
#     (« preview/dev-branch », etc.) → GitHub affiche l'URL de prévisualisation.
#   - L'URL apparaît dans : Actions → run → « Deploy to GitHub Pages » → étape
#     « Deploy » → lien, ou Settings → Pages → « Active deployment ».
#   - Pages ne garde qu'UNE prévisualisation active à la fois : pousser une autre
#     branche remplace la preview précédente (la prod main, elle, reste intacte).
#   - Pour arrêter une preview : supprimer le déploiement (Settings → Pages) ou la branche.

on:
  push:
    branches:
      - '**'          # main (prod) + toutes les autres branches (preview)
  workflow_dispatch: # relance manuelle possible (avec la branche de référence)

concurrency:
  # Une seule exécution à la fois PAR branche (pas de course entre 2 pushes)
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # déploiement GitHub Pages
      id-token: write   # OpenID Connect pour le déploiement Pages

    environment:
      # Environnement dédié : production sur main, preview/<branche> ailleurs.
      # → GitHub crée la prévisualisation au bon endroit et expose son URL.
      name: ${{ github.ref_name == 'main' && 'production-pages' || format('preview/{0}', github.ref_name) }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (site complet)
        uses: actions/upload-pages-artifact@v3
        with:
          # Racine du dépôt = site statique (index.html, manifest.json,
          # service-worker.js, icons/, pilots-index.json…)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4